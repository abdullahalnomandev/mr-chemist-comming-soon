<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr Chemist | Coming Soon</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc, #eef2f7);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #1e293b;
    }

    .wrapper {
      background: #ffffff;
      padding: 60px 50px;
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.08);
      text-align: center;
      max-width: 600px;
      width: 100%;
    }

    .logo img {
      max-width: 180px;
      margin-bottom: 40px;
    }

    .badge {
      display: inline-block;
      background: #e0f2fe;
      color: #0369a1;
      font-size: 13px;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 25px;
      letter-spacing: 0.5px;
    }

    h1 {
      font-size: 38px;
      font-weight: 700;
      margin-bottom: 18px;
    }

    .subtitle {
      font-size: 17px;
      color: #64748b;
      margin-bottom: 40px;
      line-height: 1.6;
    }

    .divider {
      width: 60px;
      height: 3px;
      background: #2563eb;
      margin: 0 auto 30px auto;
      border-radius: 5px;
    }

    .contact {
      font-size: 15px;
      color: #475569;
    }

    .contact a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @media (max-width: 600px) {
      .wrapper {
        padding: 40px 25px;
      }

      h1 {
        font-size: 28px;
      }

      .subtitle {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="wrapper">

    <!-- Logo -->
    <div class="logo">
      <!-- Replace logo.png with your real logo -->
      <img src="https://i.ibb.co.com/whDVHqbS/mr-chemist-logo-1.webp" alt="Mr Chemist Logo">
    </div>

    <div class="badge">COMING SOON</div>

    <!-- Title -->
    <h1>We Are Launching Soon</h1>

    <div class="divider"></div>

    <!-- Subtitle -->
    <p class="subtitle">
      Mr Chemist is preparing to deliver a modern and trusted pharmaceutical experience. 
      We're working behind the scenes to bring you something exceptional.
    </p>

    <!-- Contact -->
    <div class="contact">
      For enquiries, please contact us at  
      <a href="mailto:hello@mrchemist.co.uk">hello@mrchemist.co.uk</a>
    </div>

  </div>

</body>
</html>
